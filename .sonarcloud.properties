# Réglages de l'analyse automatique SonarQube Cloud.
#
# Exclus de l'analyse :
# - fichiers générés automatiquement (routeTree.gen.ts, types Supabase) ;
# - scripts SQL Supabase : les migrations sont un historique déjà exécuté
#   sur la base (on ne les modifie plus), setup.sql en est la simple
#   concaténation, et SonarQube les analyse avec des règles Oracle PL/SQL
#   qui ne s'appliquent pas à PostgreSQL (ex. « définir une constante »
#   pour chaque texte répété, ce que SQL ne permet pas).
sonar.exclusions=src/routeTree.gen.ts,src/integrations/supabase/types.ts,supabase/**/*.sql
